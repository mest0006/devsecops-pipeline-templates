# Reusable: build an image, scan it, generate an SBOM, and on the default branch
# push it to GHCR and sign it with keyless cosign (GitHub OIDC, no stored keys).
# Outputs the digest so deploy jobs can pin it.
name: container

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context.
        type: string
        default: .
      image-name:
        description: Image name under ghcr.io/<owner>/.
        type: string
        required: true
      fail-on:
        description: Trivy severities that fail the build.
        type: string
        default: HIGH,CRITICAL
    outputs:
      digest:
        description: Digest of the pushed image (empty on pull requests).
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: ${{ inputs.fail-on }}
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
        if: steps.push.outputs.digest != ''
      - name: Sign image and attach SBOM attestation (keyless)
        if: steps.push.outputs.digest != ''
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
          echo "Signed $REF" >> "$GITHUB_STEP_SUMMARY"
