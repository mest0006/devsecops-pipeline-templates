# Example caller: one short file gives a repo the full DevSecOps pipeline.
# Other repos call these templates with
#   uses: mest0006/devsecops-pipeline-templates/.github/workflows/<name>.yml@main
name: example

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    uses: ./.github/workflows/secret-scan.yml

  sast:
    uses: ./.github/workflows/sast.yml
    permissions:
      contents: read
      security-events: write
    with:
      languages: python

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s example-app -v

  image:
    needs: [secrets, sast, tests]
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      context: example-app
      image-name: devsecops-example

  verify-signature:
    needs: image
    if: needs.image.outputs.digest != ''
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Verify the image was signed by this repo's workflow
        env:
          REF: ghcr.io/${{ github.repository_owner }}/devsecops-example@${{ needs.image.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
